# Anchors and merge keys must survive a save untouched.

defaults: &defaults
  primaryColor: "#1473E6"
  tone: bold

schemaVersion: 1
template:
  id: canonical-image-text
  version: 1
  creativeType: image-text
  unit: standard-web
  layers:
    - id: image
      kind: image
    - id: shade
      kind: shade
    - id: accent
      kind: accent
    - id: static-text
      kind: static-text
    - id: logo
      kind: logo
id: corpus-anchors-merge
campaignMessage: Merge me.
targetAudience: Everyone
targetRegion: DE
products:
  - id: hydra-bottle
    name: Hydra Bottle
    logoPath: assets/inputs/hydra-logo.png
    <<: *defaults
