# Corpus fixture — leading comment block.
# A save must keep every line of this file byte for byte when nothing changed.

schemaVersion: 1
template:
  id: canonical-image-text
  version: 1
  creativeType: image-text
  unit: standard-web
  layers:
    - id: image
      kind: image
    - id: shade
      kind: shade
    - id: accent
      kind: accent
    - id: static-text
      kind: static-text
    - id: logo
      kind: logo
campaignMessage: Stay wild. Stay hydrated.
# A hand-written note about the audience.
targetAudience: Trail runners, 25-40

targetRegion: DE # inline note on targetRegion
id: corpus-comments
variation:
  count: 4 # how many creatives per slot

  axes:
    layout: [headline-top, headline-bottom]
    tone: [bold, subtle]

# product block notes
products:
  - id: hydra-bottle
    name: Hydra Bottle
    primaryColor: "#1473E6" # brand blue
    logoPath: assets/inputs/hydra-logo.png

campaignTagline: "Trail days #nofilter" # hash inside a quoted string

