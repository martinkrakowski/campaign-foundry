# Kafka (D174d: production uses Aiven Kafka), run by Strimzi in KRaft mode, one
# combined controller+broker. The only listener is TLS with client-certificate
# authentication, the same shape as Aiven's, so PT-6's code targets one
# connection model. Authorization is `simple`: a client may do only what its
# KafkaUser's ACLs allow. PT-6b3 grants the app its run-request topic and its
# consumer group; the API publishes and, with KAFKA_CONSUME=true, consumes.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  labels:
    strimzi.io/cluster: cf-kafka
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        class: local-path
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: cf-kafka
spec:
  kafka:
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
    authorization:
      type: simple
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
# The app's Kafka identity: the operator writes its client certificate and key
# to the Secret campaign-foundry (and the cluster CA to cf-kafka-cluster-ca-cert).
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: campaign-foundry
  labels:
    strimzi.io/cluster: cf-kafka
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: cf.run-requests
          patternType: literal
        operations: [Describe, Read, Write]
      - resource:
          type: group
          name: cf-workers
          patternType: literal
        operations: [Describe, Read]
---
# Run requests (PT-6b2): keyed <orgId>:<campaignId>, so one campaign's requests
# stay ordered on one partition. The Postgres job row is the lease; Kafka only
# delivers, and a duplicate or replay loses startQueuedJob and is dropped.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: cf.run-requests
  labels:
    strimzi.io/cluster: cf-kafka
spec:
  partitions: 3
  replicas: 1
