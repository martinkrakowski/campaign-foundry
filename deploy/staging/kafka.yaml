# Kafka (D174d: production uses Aiven Kafka), run by Strimzi in KRaft mode, one
# combined controller+broker. The only listener is TLS with client-certificate
# authentication, the same shape as Aiven's, so PT-6's code targets one
# connection model. Nothing consumes it yet (PT-6); no topics are created here.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  labels:
    strimzi.io/cluster: cf-kafka
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        class: local-path
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: cf-kafka
spec:
  kafka:
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
# The app's Kafka identity: the operator writes its client certificate and key
# to the Secret campaign-foundry (and the cluster CA to cf-kafka-cluster-ca-cert).
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: campaign-foundry
  labels:
    strimzi.io/cluster: cf-kafka
spec:
  authentication:
    type: tls
