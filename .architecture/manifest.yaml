system: campaign-foundry
scope: '@campaignfoundry'
architecture: modular-monolith
workspaceTemplate: modular-monolith
monorepo:
  packageManager: yarn@4.12.0
  linker: node-modules
  buildTool: turbo
  workspaces:
    - apps/*
    - packages/*
  workspaceDefaults:
    tsConfig:
      extends: ../../tsconfig.base.json
      compilerOptions:
        rootDir: src
        outDir: dist
        composite: true
        declaration: true
        emitDeclarationOnly: true
        declarationMap: true
        tsBuildInfoFile: ./dist/.tsbuildinfo
    eslint:
      template: |
        import eslint from '@eslint/js';
        import tseslint from 'typescript-eslint';
        import deterministicCore from '../../eslint.deterministic-core.js';

        export default tseslint.config(
          eslint.configs.recommended,
          ...tseslint.configs.recommended,
          {
            rules: {
              '@typescript-eslint/no-explicit-any': 'warn',
              '@typescript-eslint/no-unused-vars': ['warn', { argsIgnorePattern: '^_' }],
            },
          },
          // Deterministic core: no ambient randomness or wall clock in src/domain/**.
          ...deterministicCore(),
          {
            ignores: ['dist/**', 'node_modules/**'],
          },
        );
    packageJson:
      scripts:
        build: tsc
        lint: eslint src --ext .ts,.tsx
        typecheck: tsc --noEmit
      devDependencies:
        typescript: ^5.5.4
        eslint: ^9.0.0
        '@typescript-eslint/parser': ^8.0.0
        '@typescript-eslint/eslint-plugin': ^8.0.0
  turboConfig:
    globalDependencies:
      - '**/.env.*'
    pipeline:
      build:
        dependsOn:
          - ^build
        outputs:
          - dist/**
      lint:
        dependsOn:
          - ^build
      test:
        dependsOn:
          - ^build
      typecheck:
        outputs: []
        cache: true
# WARNING: `hexagen arch port` and `hexagen arch context` rewrite this whole file through a
# save path (`generateManifestYaml`/`generateManifestYaml2` -> `saveManifest` in
# @hexagen-monaco/sync's dist/cli.js) that keeps only `system, scope, architecture,
# bounded_contexts, monorepo, apps` — this `generator:` block, including the `naming`
# overrides below, is NOT on that list and would be silently dropped. Declare new ports and
# modules by hand instead (see .agents/architecture.md), then `yarn arch:inventory` and
# `yarn sync:dry` (expect `Total ops : 0`).
generator:
  version: 0.2.0
  sync:
    idempotent: true
    createOnlyIfMissing: true
    nonDestructive: true
    layers:
      domain:
        folder: src/domain
        subfolders:
          - entities
          - value-objects
      application:
        folder: src/application
        subfolders:
          - use-cases
          - ports/in
          - ports/out
      infrastructure:
        folder: src/infrastructure
        subfolders:
          - adapters
    packageJson:
      mergeStrategy: preserveExisting
      injectIfMissing:
        scripts:
          build: tsc
          lint: eslint src --ext .ts,.tsx
          typecheck: tsc --noEmit
    stubs:
      enabled: true
      # The committed tree names ports `<Name>Port.ts` and adapters `<Name>.ts`
      # (PascalCase modules, no per-layer suffix); hexagen's built-in defaults
      # (`{name}.in-port.ts` etc.) do not match them, so declaring ports or
      # adapters in any inventory list would make sync scaffold duplicate
      # stub files next to the real modules. These overrides align emission
      # with the files the code actually has — with them, every declared
      # module resolves to an existing file and sync plans zero operations.
      naming:
        inPort: '{name}.ts'
        outPort: '{name}.ts'
        adapter: '{name}.ts'
    apps:
      enabled: true
apps:
  - name: web
    framework: next.js
    depends_on: &ref_0
      - CampaignOrchestration
      - CreativeGeneration
      - Distribution
      - GovernanceAndCompliance
  - name: api
    framework: nitro
    depends_on: *ref_0
bounded_contexts:
  - name: shared
    type: shared-kernel
    description: Shared primitives, custom errors, base classes, utilities
    depends_on: []
    uiFramework: Next.js
    apiFramework: Express
    layers:
      domain:
        entities: []
        value_objects:
          - SeededRandom
        domain_services: []
      application:
        use_cases: []
        ports:
          in: []
          out: []
      infrastructure:
        adapters: []
  - name: CampaignOrchestration
    type: core
    description: >
      The core driving context that manages the full lifecycle of a campaign
      brief through generation, compositing, compliance, and export.
    depends_on:
      - shared
    uiFramework: Next.js
    apiFramework: Express
    layers:
      domain:
        entities:
          - CampaignBrief
          - GeneratedAsset
          - Product
          - Variant
        value_objects:
          - AspectRatio
          - AudioRights
          - BackgroundSource
          - ComplianceResult
          - CopyPool
          - CopyTimeline
          - LogEntry
          - MotionKind
          - PipelineExecutionLog
          - PipelineResult
          - Treatment
          - VariationPlan
          - VariationPolicy
        domain_services: []
      application:
        use_cases:
          - GenerateCampaignUseCase
          - PlanVariationsUseCase
          - PreviewCreativeFrameUseCase
        ports:
          in:
            - CampaignPipelinePort
          out:
            - BackgroundCachePort
            - CompliancePort
            - CompositorPort
            - CopyGeneratorPort
            - ExportPort
            - ImageGeneratorPort
            - PlatformProfilePort
            - SceneAssetPort
            - VideoCompositorPort
      infrastructure:
        adapters:
          - NodeCryptoPolicyHasher
    generator:
      eslint:
        template: |
          import eslint from '@eslint/js';
          import tseslint from 'typescript-eslint';
          import deterministicCore from '../../eslint.deterministic-core.js';

          export default tseslint.config(
            eslint.configs.recommended,
            ...tseslint.configs.recommended,
            {
              rules: {
                '@typescript-eslint/no-explicit-any': 'warn',
                '@typescript-eslint/no-unused-vars': ['warn', { argsIgnorePattern: '^_' }],
              },
            },
            // Deterministic core, widened to the use cases.
            ...deterministicCore({
              extraFiles: ['src/application/use-cases/**/*.ts'],
            }),
            {
              ignores: ['dist/**', 'node_modules/**'],
            },
          );
  - name: CreativeGeneration
    type: core
    description: >
      Driven context responsible for background resolution and deterministic
      canvas compositing. Has no knowledge of CampaignBrief or use-case logic.
    depends_on:
      - shared
      - CampaignOrchestration
    uiFramework: Next.js
    apiFramework: Express
    layers:
      domain:
        entities: []
        value_objects: []
        domain_services: []
      application:
        use_cases: []
        ports:
          in: []
          out: []
      infrastructure:
        adapters:
          - AssetReusingImageGenerator
          - CanvasFfmpegVideoCompositor
          - FileSystemBackgroundCache
          - FileSystemSceneAssetResolver
          - FireflyImageGenerator
          - GeminiImageGenerator
          - NodeCanvasCompositor
          - OpenRouterCopyGenerator
          - OpenRouterImageGenerator
          - ProceduralBackgroundGenerator
  - name: GovernanceAndCompliance
    type: core
    description: >
      Driven context acting as the automated circuit breaker for legal copy
      safety and visual brand adherence.
    depends_on:
      - shared
      - CampaignOrchestration
    uiFramework: Next.js
    apiFramework: Express
    layers:
      domain:
        entities: []
        value_objects: []
        domain_services: []
      application:
        use_cases: []
        ports:
          in: []
          out: []
      infrastructure:
        adapters:
          - BrandComplianceChecker
  - name: Distribution
    type: core
    description: >
      Driven context handling file persistence, print-proof generation, and
      per-platform packaging of already-rendered creatives.
    depends_on:
      - shared
      - CampaignOrchestration
    uiFramework: Next.js
    apiFramework: Express
    layers:
      domain:
        entities: []
        value_objects:
          - PlatformProfile
        domain_services: []
      application:
        use_cases:
          - PackageForPlatformUseCase
        ports:
          in: []
          out:
            - PackageStorePort
      infrastructure:
        adapters:
          - FileSystemExporter
          - FileSystemPackageStore
  - name: ui
    type: generic
    description: >
      Domain-free presentation kit. No hexagonal split — files live at src/
      and are the presentation layer (D100). The four files that import the
      campaign feature stay in apps/web.
    depends_on:
      - shared
      - CampaignOrchestration
      - Distribution
    uiFramework: Next.js
    apiFramework: Express
    layers:
      domain:
        entities: []
        value_objects: []
        domain_services: []
      application:
        use_cases: []
        ports:
          in: []
          out: []
      infrastructure:
        adapters: []
    generator:
      tsConfig:
        compilerOptions:
          jsx: react-jsx
          lib:
            - DOM
            - DOM.Iterable
            - ES2022
