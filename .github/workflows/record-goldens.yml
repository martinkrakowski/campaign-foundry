name: Record compositor goldens

# Manual recording on the platform CI asserts (ubuntu-latest → linux-x64).
# Never push or commit: the artifact is the output. A human (or the A0 lane)
# downloads it and commits the cells. Do not set RECORD_COMPOSITOR_GOLDENS
# on the normal CI run — that would rewrite goldens instead of asserting them.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which golden suite(s) to record. 'all' (default) re-records every family's fixture map for this platform key — including the silent MP4 golden and the PNG stills. 'audio' records ONLY compositor-goldens-mp4-audio.json (the audio-golden.test.ts suite) and touches no other fixture file. Never leave this on 'all' just to pick up one new cell — a golden is never re-recorded, and 'all' re-records every existing one whether or not its bytes actually moved."
        type: choice
        options:
          - all
          - audio
        default: all
  # GitHub only indexes workflow_dispatch files that exist on the default
  # branch. ci.yml (already on main) calls this via workflow_call when
  # dispatched with record_goldens=true against this ref.
  workflow_call:
    inputs:
      suite:
        description: "Which golden suite(s) to record: 'all' or 'audio'. See the workflow_dispatch input above."
        type: string
        default: all

permissions:
  contents: read

jobs:
  record:
    name: Record compositor goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Same setup as ci.yml: Corepack before setup-node so `cache: yarn`
      # probes Berry's cache folder, not Yarn Classic's.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "yarn"

      - name: Prepare package manager
        run: |
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate

      - name: Install dependencies
        run: "yarn install --immutable"

      - name: Build
        run: "yarn build"
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      # 'audio' records ONLY compositor-goldens-mp4-audio.json — the other
      # three fixture files are never opened by this run, so they cannot move.
      # 'all' (default) keeps the original behaviour: every suite records.
      #
      # SUITE arrives via `env:`, never interpolated into the script: `${{ }}`
      # is substituted into the run block's TEXT before bash ever sees it, so
      # a `${{ inputs.suite }}` here would let anyone who can call this
      # workflow_call inject shell (the workflow_dispatch choice list and the
      # ci.yml caller both restrict the UI value, but workflow_call's own
      # `type: string` input does not — the restriction has to hold at the
      # point of use). Binding it to an env var makes it arrive as data; the
      # `case` below is the actual enforcement, refusing anything but the two
      # known values instead of building a file list by string concatenation.
      - name: Record compositor goldens
        env:
          NODE_ENV: test
          RECORD_COMPOSITOR_GOLDENS: "1"
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            audio)
              yarn vitest run packages/CreativeGeneration/src/infrastructure/adapters/__tests__/CanvasFfmpegVideoCompositor.audio-golden.test.ts
              ;;
            all)
              yarn vitest run packages/CreativeGeneration/src/infrastructure/adapters/__tests__/NodeCanvasCompositor.goldens.test.ts packages/CreativeGeneration/src/infrastructure/adapters/__tests__/NodeCanvasCompositor.motion-goldens.test.ts packages/CreativeGeneration/src/infrastructure/adapters/__tests__/NodeCanvasCompositor.text-effect-goldens.test.ts packages/CreativeGeneration/src/infrastructure/adapters/__tests__/CanvasFfmpegVideoCompositor.byte-golden.test.ts packages/CreativeGeneration/src/infrastructure/adapters/__tests__/CanvasFfmpegVideoCompositor.audio-golden.test.ts
              ;;
            *)
              echo "::error::suite must be 'all' or 'audio', got: $SUITE"
              exit 1
              ;;
          esac

      - name: Upload golden fixtures
        uses: actions/upload-artifact@v4
        with:
          name: compositor-goldens-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            packages/CreativeGeneration/src/infrastructure/adapters/__tests__/fixtures/compositor-goldens*.json
