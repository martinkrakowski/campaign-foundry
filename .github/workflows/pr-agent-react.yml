name: "PR-Agent State Freshness Review"

# An LLM reviewer for STATE FRESHNESS in `apps/web` — the fourth PR-Agent reviewer.
#
# WHAT THIS REVIEWER IS FOR. This app has no state library. It shares a **monotonic token** and
# enforces one invariant by hand at every site: the newest answer wins, and a stale one must never
# be admitted. Two mechanisms carry it, and there is **no shared helper for either**:
#
#   * the in-memory stamp — `BriefEditor.tsx:312-315` (`let generation = 0`, each round returns
#     early unless `round === generation`) and `HeadlinePoolDrawer.tsx:160`, which does the same
#     thing with a ref (`loadGeneration.current !== generation`). Two sites, two shapes already.
#   * the server token — `state.source.revision`, guarding conditional saves, with the rule stated
#     at `editor-state.ts:2044-2049`: an absent revision downgrades the next save to
#     last-write-wins; a fabricated one satisfies a write that should fail.
#
# The reviewer's four classes are A (a stale answer is admitted), B (a write guard is silently
# downgraded), C (a cache sits upstream of a guard), D (the per-keystroke commit budget). They are
# in the instructions below, with the citations above.
#
# WHY IT REPLACED AN EFFECT-DISCIPLINE PROMPT, recorded so it is not re-litigated. The first
# version of this file applied the "War on useEffect" position — useEffect as a primitive for
# external synchronisation only. It was calibrated but aimed at the wrong invariant for this
# codebase: `apps/web` has ~83 effect call sites and most are correct, so the bot's best case was
# arguing about a style the repository has already chosen. The owner named the real architecture
# (a shared monotonic token) and it reframed the whole reviewer. Effects remain in scope, but only
# as the PLACE where a stale answer is admitted — class A — never as a count.
#
# THE EVIDENCE FOR CLASS C, which is why it is ranked highest. A cache keyed on content, sitting
# upstream of a guard keyed on identity, makes the guard unreachable while every test still passes.
# It shipped three times on 2026-09-16 alone: a draft re-slug blanking the preview every keystroke
# (#448), then a rail memo omitting the brief id, then the same memo omitting the product id. No
# existing bot rule names this class.
#
# WHAT WOULD MAKE THIS REVIEWER WORTHLESS is unchanged from `pr-agent-arch.yml`'s warning: a bot
# that reports what a deterministic tool already catches trains people to skim it, and a bot people
# skim is how a real finding gets missed. Every comment must name a failure scenario — an
# interleaving, a lost write, a stale frame — not a smell.
#
# A named helper for the `generation` pattern, and a `revision` type where "no guard" cannot happen
# by accident, would each remove a class from this reviewer's remit by construction. Both are lanes,
# not reviewer settings, and neither is proposed here.

# OPERATIONAL SCAFFOLDING IS IDENTICAL TO pr-agent.yml AND pr-agent-api.yml BY CONSTRUCTION —
# the digest pin, the concurrency key, the did-it-actually-run guard. Every one of those
# blocks records a failure that was actually hit; a change to one is a change to all four
# files. Read pr-agent.yml's comments for the reasoning, which is not repeated here.
#
# Config in .pr_agent.toml is read from the DEFAULT BRANCH and is SHARED by all four
# workflows. Per-reviewer differences live in this file's env block.

on:
  pull_request:
    # `synchronize` removed (2026-09-03): re-reviewing every push produced the
    # finding-decay loop — round one found real defects, round three posted style
    # opinions and re-raised already-refuted findings verbatim. One review per PR
    # lifecycle; a human can still summon a fresh pass with /improve via pr-agent.yml.
    types: [opened, reopened, ready_for_review]
    # D4: a CSS-only PR must not pay for three LLM reviews.
    paths:
      # Extension-scoped, not the whole of `apps/web`. D4 — "a CSS-only PR must not pay for
      # three LLM reviews" — is quoted in this file's own header, and `apps/web/**` breaks it:
      # a PR touching only Tailwind classes, an SVG, a JSON fixture or a config file cannot
      # contain a React effect, so a model call on it buys nothing. Only TS and TSX can carry
      # the defect classes below. Caught in review of this very PR, which is the D4 violation
      # arriving in the file that cites D4.
      - "apps/web/**/*.ts"
      - "apps/web/**/*.tsx"
  # NOTE the deliberate absence of `issue_comment`, which pr-agent.yml does have.
  #
  # GitHub has no `paths` filter for issue_comment. Wiring the command path here would mean
  # a single `/improve` on ANY pull request — including one that changes no `apps/web` file at all
  # — fires every reviewer, which is precisely the cost D4 exists to avoid. The plan's
  # P1.2 named the command path before that interaction was worked through.
  #
  # The cost of leaving it out is covered by `synchronize` above, not by "Re-run jobs":
  # re-running replays the ORIGINAL head SHA, so it re-reviews code that was already
  # reviewed and says nothing about commits pushed since. Without `synchronize` a defect
  # pushed after the PR opened would never be seen by this reviewer at all, and unlike
  # pr-agent.yml there is no `/improve` fallback to compensate.

permissions:
  contents: read
  pull-requests: write
  issues: write

# Prefixed `pr-agent-react-` so this reviewer has its OWN group. D1: a rate-limited or failing
# freshness review must not cancel the UI, API or architecture one. The keying by what the run produces and by sender
# type is carried from pr-agent.yml; with no issue_comment trigger only the 'improve' arm is
# reachable here, and it is kept in full so the three files stay diffable against each other.
concurrency:
  group: >-
    pr-agent-react-${{ github.event.pull_request.number || github.event.issue.number
    }}-${{ ((github.event_name == 'pull_request'
    || github.event.comment.body == '/improve'
    || startsWith(github.event.comment.body, '/improve '))
    && 'improve')
    || ((github.event.comment.body == '/review'
    || startsWith(github.event.comment.body, '/review '))
    && 'review')
    || 'other' }}-${{ github.event.sender.type }}
  cancel-in-progress: true

jobs:
  pr_agent_react:
    name: "PR-Agent state freshness review"
    if: >-
      github.event.sender.type != 'Bot'
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: "Stamp run start"
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: "PR Agent"
        uses: docker://pragent/pr-agent@sha256:b81235c3bddc551939a1feca8926f4b6e8abcec2ae5bf4620424f8f56dd9cb93 # 0.42.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_KEY }}
          config.restricted_mode: "true"
          config.model: "openrouter/inception/mercury-2"
          config.fallback_models: '["openrouter/anthropic/claude-haiku-4.5"]'
          config.custom_model_max_tokens: "128000"
          config.max_model_tokens: "70000"
          # Every entry verified to exist. A missing file is SKIPPED, not fatal, so a stale
          # list is a silent way to ship a reviewer with less context than intended.
          # DESIGN.md is deliberately absent: it is the UI reviewer's context (pr-agent.yml),
          # and handing it to this one invites duplicate contract findings on a diff this
          # reviewer is meant to read for DATA FLOW. `.agents/architecture.md` is absent for
          # the same reason — it belongs to the architecture reviewer.
          config.repo_context_files: '["AGENTS.md", ".agents/testing.md", "best_practices.md"]'
          config.repo_context_max_lines: "3000"
          config.ai_timeout: "600"
          pr_reviewer.require_ticket_analysis_review: "false"
          github_action_config.auto_review: "false"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          pr_code_suggestions.extra_instructions: |
            You are the state-freshness reviewer for campaign-foundry's `apps/web`. This app does
            not use a state library. It shares a **monotonic token** and enforces one invariant by
            hand at every site: **the newest answer wins, and a stale one must never be admitted.**
            Your subject is that invariant. Find defects; do not summarise the PR, and do not count
            effects.

            There is no shared helper for any of this. Each site is written out longhand, which is
            why a reviewer earns its cost here: the fourth hand-rolled copy is where the mistake
            goes in.

            THE FOUR CLASSES, IN THE ORDER THEY MATTER HERE.

            **A. A STALE ANSWER IS ADMITTED.** The in-memory stamp: `BriefEditor.tsx:312-315`
            declares `let generation = 0` and each round returns early unless `round === generation`
            — its own comment says why: "Mount and focus requests overlap, and responses can land
            out of order. Stamp each round so a slow older answer cannot replace a newer verdict."
            `HeadlinePoolDrawer.tsx:160` does the same thing with a **ref**
            (`loadGeneration.current !== generation`), so the shape already varies between sites.
            Look for: a round that captures the stamp and never compares it; a comparison after the
            FIRST await but not after the last, when every await is a re-entry point; an entry path
            that bumps the counter while another (a retry, a focus refetch, a remount) does not; a
            `setTimeout` or retry that re-enters carrying a stale round; a cancel flag set in
            cleanup while a timer still fires. **Failure scenario to state: which two rounds
            overlap, which resolves second, and what wrong value lands on screen.**

            **B. A WRITE GUARD IS SILENTLY DOWNGRADED.** The server token: `state.source.revision`
            guards conditional saves, and `editor-state.ts:2044-2049` states the rule exactly — "An
            entry that carries no revision never wipes the guard the editor already holds — an
            absent revision would downgrade the next save to last-write-wins, a fabricated one would
            satisfy a write that should fail." Look for: a path that rebuilds `source` and drops
            `revision`; `revision: entry?.revision` where the entry may not carry one; 409 handling
            that retries without adopting the fresh token; a truthiness test where `undefined` means
            "no guard" and `""` would mean something else. **Failure scenario to state: two editors,
            which write lands, and whose work is overwritten with no error.**

            **C. A CACHE SITS UPSTREAM OF A GUARD.** The highest-yield class in this codebase: any
            memo, cache or early-return keyed on **content** must include every **identity** term its
            consumer keys on, or the consumer's guard can never fire — the cache hides the change
            before it arrives. `usePreviewFrame` (`preview-frame.ts:83,140-146`) keys its
            clear-on-switch guard on `identityKey ?? request.brief.id` plus the cell's own axes; a
            memo feeding it that omits any of those makes the guard unreachable while every test
            still passes. This shipped three times in one day: the draft re-slug (#448), then a rail
            memo omitting the brief id, then the same memo omitting the product id. **Ask of every
            new memo: what does its consumer compare, and is every one of those terms in this key?**

            **D. THE COMMIT BUDGET.** Per-keystroke render commits are a measured number here, with
            two lanes behind it (X30, X32) and tests asserting `toBeLessThanOrEqual` on it. A change
            or a suggestion that adds a commit per keystroke is a regression, not a fix. Do not
            police memoisation on taste — flag only an added commit you can name.

            WHAT IS NOT A FINDING, AND THIS LIST IS BINDING.

            * The number of `useEffect` calls in a file. `apps/web` has ~83 and most are correct.
              Effects are in scope only as the PLACE where a stale answer is admitted (class A) —
              never as a style matter.
            * An effect that genuinely synchronises with an external system: an `AbortController`
              fetch, a `ResizeObserver`, an event listener, `localStorage`, focus or scroll
              management, a timer.
            * A library recommendation. There is no TanStack Query, SWR, Zustand, Jotai, Redux
              Toolkit, React Hook Form or Zod here, and adding a dependency is the owner's decision.
              Propose fixes in terms of what exists: compare the stamp, carry the token, widen the
              key, move the work into the handler.
            * An existing pattern the diff merely moves or reformats. Judge what the diff CHANGES.

            HOUSE RULES THAT OUTRANK EVERYTHING ABOVE.

            * Every finding carries a concrete failure scenario — specific interleaving or state, and
              the wrong value, lost edit or stale frame that results. "This could race" is not a
              finding. "The focus refetch bumps `generation` but the retry timer captured the old
              round, so a retry that resolves after a refocus overwrites the newer verdict" is.
            * Say what your fix does to inputs the code already handles, and whether it turns a loud
              failure into a quiet one. Trading a visible bug for a silent wrong value is worse.
            * This app is prerendered by Next. A `"use client"` component still runs its render and
              its `useState` initialiser ON THE SERVER, where there is no `window`. Any suggestion
              moving work into render must say whether it survives that — it broke the build once.
            * User-facing strings live in `messages.ts` (D2), and raw domain values go through
              `display-names.ts` before a person sees them (D18). A suggestion that inlines copy or a
              raw format value is wrong even when its logic is right.
            * Cite D-numbers from docs/planning/ where a rule has one.

            Do not re-raise what CodeRabbit, the UI reviewer or the architecture reviewer owns. Do
            not comment to acknowledge, praise or summarise. Prefer silence to a speculative finding:
            one real staleness defect is worth more than five style opinions.
          pr_code_suggestions.commitable_code_suggestions: "true"
          pr_code_suggestions.publish_output_no_suggestions: "false"
          pr_code_suggestions.focus_only_on_problems: "true"
          pr_code_suggestions.num_code_suggestions_per_chunk: "6"
          pr_code_suggestions.max_number_of_calls: "6"
          pr_code_suggestions.parallel_calls: "true"
          pr_code_suggestions.suggestions_score_threshold: "0"

      # Identical in intent and text to pr-agent.yml's guard: PR-Agent exits 0 even when it
      # could not produce a review, so a green check would claim work that did not happen.
      # --paginate --slurp because --paginate alone concatenates one JSON document per page
      # and the count would stop being a single integer. Errors are NOT converted to zero.
      # KNOWN LIMIT, stated rather than hidden: PR-Agent's failure notice is posted by
      # github-actions[bot] with the same text from all FOUR reviewers, and the issue
      # comment carries nothing identifying which workflow produced it. On a PR that
      # triggers two reviewers at once, one failing makes both guards red.
      #
      # Adding this reviewer WIDENS that limit rather than leaving it unchanged, which is
      # the honest cost of the fourth file: an `apps/web` PR now commonly triggers both the
      # UI reviewer and this one, so a single OpenRouter failure reddens two checks and
      # names neither. The fix is upstream attribution, not a weaker guard here — a guard
      # that cannot tell "I could not check" from "nothing was wrong" is the defect this
      # step exists to prevent.
      #
      # That weakens D1's isolation, and the trade is deliberate: this guard exists because
      # PR-Agent exits 0 when it could not produce a review, so a green check would claim
      # work that never happened. Cross-contamination fails in the SAFE direction — a
      # spurious red on an advisory check that gates nothing (D8) — and the alternative,
      # dropping the guard, restores exactly the false-green it was built to catch.
      #
      # `since` is the step stamp rather than the job start, which narrows the overlap
      # window to this reviewer's own LLM call. It does not eliminate it.
      - name: "Fail if the review did not actually run"
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp --method GET "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" > "$RUNNER_TEMP/pages.json"
          FILTER='[.[][] | select(.user.login == "github-actions[bot]") | select(.created_at >= $since) | select(.body | test("Failed to generate"))] | length'
          jq --arg since "$STARTED_AT" "$FILTER" "$RUNNER_TEMP/pages.json" > "$RUNNER_TEMP/failures"
          failed=$(cat "$RUNNER_TEMP/failures")
          case "$failed" in
            ''|*[!0-9]*)
              echo "Expected a single integer from the comment scan, got: $failed"
              exit 1
              ;;
          esac
          if [ "$failed" -gt 0 ]; then
            echo "PR-Agent reported it could not generate a review."
            echo "A green check here would claim a review that never happened."
            exit 1
          fi
          echo "No PR-Agent failure notice from this run."
