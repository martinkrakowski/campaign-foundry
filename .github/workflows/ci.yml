name: CI

# Generated by the hexagen ci-github-actions template. Commands target yarn
# (the package manager the generator and its templates use); npm/pnpm users
# should adjust the install/run commands (e.g. `npm ci`, `npm run <script>`).
# Choices recorded at install time:
#   triggers:        push-all-branches,pull-request,push-main-only
#   run tests:       true
#   cache strategy:  turbo-cache
#   deploy target:   none
#   preview deploys: true
#   docker image:    false
#
# The `on:` block below covers every branch push + PRs to main. Narrow it to
# match your triggers — e.g. push-main-only -> `branches: [main]`, or drop the
# `push:` key entirely to run on pull_request only.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      record_goldens:
        description: "Record compositor goldens (linux-x64 artifact). The CI job still runs."
        type: boolean
        default: false
      record_goldens_suite:
        description: "Which golden suite(s) record_goldens records. 'all' (default) re-records every family's fixture map for this platform key; 'audio' records ONLY compositor-goldens-mp4-audio.json and leaves every other fixture file untouched."
        type: choice
        options:
          - all
          - audio
        default: all

# Concurrency is per-job, not per-workflow. A workflow_dispatch that records
# goldens used to share `ci-${{ github.ref }}` with the push Build, and the two
# cancelled each other (runs 34182560608 / 34182554160). The recorder has its
# own group below; the Build group includes event_name so a dispatch's CI job
# does not cancel a push's.
jobs:
  ci:
    name: Build, Typecheck, Lint & Test
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          # The manifest-replay step below diffs against the base ref to find
          # which manifests this change touches; a depth-1 clone has no base.
          fetch-depth: 0

      # Corepack ships with the runner's pre-installed Node and must be enabled
      # BEFORE setup-node: the `cache: yarn` step below probes the cache folder
      # with whatever `yarn` is on PATH, and without Corepack that's Yarn Classic
      # — which reports the wrong folder and fails the cache step. Enabling here
      # installs the Yarn-4 shim (version read from package.json `packageManager`)
      # so the probe resolves Berry's cache folder. See SETUP.md.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          # yarn.lock is committed, so setup-node keys its cache on it. Corepack
          # (above) makes the probed folder Berry's global cache
          # (enableGlobalCache: true → ~/.yarn/berry/cache). A wrong/empty cache
          # only costs a re-download — `install --immutable` stays the source of
          # truth — so this can never turn a green build red.
          cache: "yarn"

      # Read the pinned version from package.json's `packageManager` at runtime
      # so CI can never drift from what the project declares (no baked version).
      # Runs under the Node setup-node just installed; the shim from Enable
      # Corepack stays on PATH (Node 22 ships no competing `yarn`).
      - name: Prepare package manager
        run: |
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate

      # yarn.lock is committed, so install is immutable: CI fails on a stale
      # lockfile instead of silently rewriting it. This also protects the
      # sync --check step below — its clean-tree preflight would otherwise
      # trip on an install-mutated lockfile and mask the real drift signal.
      - name: Install dependencies
        run: "yarn install --immutable"

      # Hexagen architecture gates (require >=0.7.0 — earlier CLIs exited 0 on
      # every failure mode, so gating was vacuous; see .agents/session-log.md,
      # 2026-06-09 entry). `sync --check` is read-only and exits 1 iff the
      # committed tree drifted from what .architecture/manifest.yaml generates;
      # `arch validate` enforces the layer/import rules. Both are sub-second,
      # hence ahead of the build for fail-fast.
      - name: Architecture drift gate (hexagen sync --check)
        run: "yarn sync:check"

      - name: Architecture lint (hexagen arch validate)
        run: "yarn lint:arch"

      # A plan lane states a falsifiable premise about the code it intends to
      # change (docs/planning/, ```premise``` fences). A premise that stopped
      # holding means the gap was closed elsewhere and the lane must not be
      # dispatched; a premise that times out is inconclusive. Both fail the PR,
      # so a plan can never drift from the code un-noticed.
      - name: Verify plan premises (yarn plan:verify)
        run: "yarn plan:verify"

      # `arch validate` proves the layer rules; `sync --check` proves the tree
      # matches what the manifest emits; neither looks at the per-context
      # INVENTORIES (entities, value objects, use cases, ports, adapters)
      # listed in `.architecture/manifest.yaml`, and this closes that gap:
      # a declared entry with no module file, or a module file with no entry,
      # fails the PR. Sub-second, like the gates above.
      - name: Verify manifest inventories (yarn arch:inventory)
        run: "yarn arch:inventory"

      # A mutation manifest records the mutations a lane claims its tests catch.
      # Replaying it is what makes the claim evidence rather than a report: two
      # seats this week stated verdicts they had never observed, one quoting
      # failure messages from a suite whose own log showed it had not started.
      # Only manifests this change touches are replayed — each mutation runs a
      # real test command, so replaying all of them every time would grow
      # without bound. A claim is checked when it is made.
      - name: Replay changed mutation manifests
        env:
          # On a push, origin/main IS the pushed commit, so diffing against it
          # finds nothing and every manifest is skipped in silence. The pre-push
          # SHA is what "what this push changed" actually means.
          MANIFEST_DIFF_BASE: ${{ github.event.before }}
        run: "sh scripts/verify-manifests.sh"

      # Turbo caches task outputs keyed by input hash, so unchanged packages are
      # skipped on warm runs (cache_strategy = turbo-cache). Set TURBO_TOKEN
      # and TURBO_TEAM below for the cross-run remote cache.
      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # `check:env` is provided by the env-setup template. Resilient by design:
      # runs only if the script exists, so CI stays green whether or not
      # env-setup is installed (Item 3 will emit this step conditionally).
      - name: Validate env vars
        run: |
          if node -e "try { process.exit(require('./package.json').scripts?.['check:env'] ? 0 : 1) } catch { process.exit(1) }"; then
            yarn check:env
          else
            echo "no check:env script — skipping (env-setup not installed or package.json unreadable)"
          fi
        env:
          NODE_ENV: test

      - name: Build
        run: "yarn build"
        env:
          # TODO: add TURBO_TOKEN (secret) and TURBO_TEAM (variable) for the
          # remote Turbo cache. Safe to omit — the build just won't share cache.
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      - name: Typecheck
        run: "yarn typecheck"

      # X1: the formatter is a gate, not a suggestion. It runs BEFORE lint so a
      # formatting failure reads as "run yarn format", not as a lint error whose
      # message points somewhere else. The glob matches `yarn format`'s exactly —
      # the writer and the checker must not be able to disagree about scope, which
      # is why `.md` was dropped from both together rather than from one.
      - name: Format check (yarn format:check)
        run: "yarn format:check"

      - name: Lint
        run: "yarn lint"

      # run_tests = true; delete this step to skip tests in CI.
      # test:cov enforces the 100% coverage gate (vitest.config.ts thresholds).
      - name: Test
        run: "yarn test:cov"
        env:
          NODE_ENV: test

      # Tests live in __tests__/ next to their modules, but Nitro scans apps/api/server/
      # recursively. A *.test.ts file landing there gets registered as a route and crashes
      # `yarn dev` at boot — a runtime fault the build and coverage gate don't catch. Fail
      # the build if the Nitro route manifest ever references a test file.
      - name: Guard the API route scan against test files
        run: |
          MANIFEST="apps/api/.nitro/types/nitro-routes.d.ts"
          yarn workspace @campaignfoundry/api exec nitro prepare
          # Fail closed: a missing manifest means the guard can't validate anything.
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Nitro route manifest not found at $MANIFEST"
            exit 1
          fi
          # `\.test\b` is robust to Nitro's quoting/extension (matches .test', .test.ts, .test/, …).
          if grep -Eq '__tests__|\.test\b' "$MANIFEST"; then
            echo "::error::A test file was scanned as a Nitro route. Keep tests out of the server scan (see apps/api/nitro.config.ts \`ignore\`)."
            exit 1
          fi
          echo "Nitro route manifest is free of test files."

  # Dispatch entry for record-goldens.yml: GitHub 404s a workflow_dispatch
  # that is not on the default branch. This job is a no-op on push/PR.
  record-goldens:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.record_goldens == 'true' }}
    concurrency:
      group: record-goldens-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/record-goldens.yml
    with:
      suite: ${{ github.event.inputs.record_goldens_suite }}
    secrets: inherit
