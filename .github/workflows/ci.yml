name: CI

# Generated by the hexagen ci-github-actions template. Commands target yarn
# (the package manager the generator and its templates use); npm/pnpm users
# should adjust the install/run commands (e.g. `npm ci`, `npm run <script>`).
# Choices recorded at install time:
#   triggers:        push-all-branches,pull-request,push-main-only
#   run tests:       true
#   cache strategy:  turbo-cache
#   deploy target:   none
#   preview deploys: true
#   docker image:    false
#
# The `on:` block below covers every branch push + PRs to main. Narrow it to
# match your triggers — e.g. push-main-only -> `branches: [main]`, or drop the
# `push:` key entirely to run on pull_request only.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      record_goldens:
        description: "Record compositor goldens (linux-x64 artifact). The CI job still runs."
        type: boolean
        default: false
      record_goldens_suite:
        description: "Which golden suite(s) record_goldens records. 'all' (default) re-records every family's fixture map for this platform key; 'audio' records ONLY compositor-goldens-mp4-audio.json and leaves every other fixture file untouched."
        type: choice
        options:
          - all
          - audio
        default: all

# Concurrency is per-job, not per-workflow. A workflow_dispatch that records
# goldens used to share `ci-${{ github.ref }}` with the push Build, and the two
# cancelled each other (runs 34182560608 / 34182554160). The recorder has its
# own group below; the Build group includes event_name so a dispatch's CI job
# does not cancel a push's.
jobs:
  ci:
    name: Build, Typecheck, Lint & Test
    runs-on: ubuntu-latest
    concurrency:
      # On main every commit gets its own group (D182), so a push never cancels or
      # replaces the run verifying the merge before it (98ac160d was cancelled by a
      # docs push, 2026-09-29). `cancel-in-progress: false` alone would not do: a
      # group keeps one pending run, and a third push replaces it. Other refs still
      # cancel superseded runs.
      group: ci-${{ github.ref }}-${{ github.event_name }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
      cancel-in-progress: true
    # A real Postgres for the PT-6a concurrency proof: PGlite is one connection,
    # so it cannot show two workers racing a claim (TEST_DATABASE_URL below).
    # Every other database test still runs on PGlite — this service exists for
    # that one gated test file, not as a second way to run the suite.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          # The manifest-replay step below diffs against the base ref to find
          # which manifests this change touches; a depth-1 clone has no base.
          fetch-depth: 0

      # Corepack ships with the runner's pre-installed Node and must be enabled
      # BEFORE setup-node: the `cache: yarn` step below probes the cache folder
      # with whatever `yarn` is on PATH, and without Corepack that's Yarn Classic
      # — which reports the wrong folder and fails the cache step. Enabling here
      # installs the Yarn-4 shim (version read from package.json `packageManager`)
      # so the probe resolves Berry's cache folder. See SETUP.md.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          # yarn.lock is committed, so setup-node keys its cache on it. Corepack
          # (above) makes the probed folder Berry's global cache
          # (enableGlobalCache: true → ~/.yarn/berry/cache). A wrong/empty cache
          # only costs a re-download — `install --immutable` stays the source of
          # truth — so this can never turn a green build red.
          cache: "yarn"

      # Read the pinned version from package.json's `packageManager` at runtime
      # so CI can never drift from what the project declares (no baked version).
      # Runs under the Node setup-node just installed; the shim from Enable
      # Corepack stays on PATH (Node 22 ships no competing `yarn`).
      - name: Prepare package manager
        run: |
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate

      # yarn.lock is committed, so install is immutable: CI fails on a stale
      # lockfile instead of silently rewriting it. This also protects the
      # sync --check step below — its clean-tree preflight would otherwise
      # trip on an install-mutated lockfile and mask the real drift signal.
      - name: Install dependencies
        run: "yarn install --immutable"

      # Hexagen architecture gates (require >=0.7.0 — earlier CLIs exited 0 on
      # every failure mode, so gating was vacuous; see .agents/session-log.md,
      # 2026-06-09 entry). `sync --check` is read-only and exits 1 iff the
      # committed tree drifted from what .architecture/manifest.yaml generates;
      # `arch validate` enforces the layer/import rules. Both are sub-second,
      # hence ahead of the build for fail-fast.
      - name: Architecture drift gate (hexagen sync --check)
        run: "yarn sync:check"

      - name: Architecture lint (hexagen arch validate)
        run: "yarn lint:arch"

      # Nothing in the gate set looked at BYTES. A raw \x00 inside a string
      # literal in PlanCapacity.ts survived build, typecheck, lint, format:check
      # and all 6033 tests: TypeScript accepts a control byte in a literal,
      # ESLint parses it, Prettier reprints it unchanged, and every test that
      # read the string compared it against itself. It was caught only because a
      # mutation anchor stopped matching — by accident.
      #
      # This scans the tracked and untracked-but-not-ignored text files for C0
      # bytes other than tab and newline. Measured at 144ms over 919 files, so it
      # sits here with the other sub-second gates rather than behind the build: a
      # byte defect should be reported in a second, not after a suite.
      - name: Source byte hygiene (yarn lint:bytes)
        run: "yarn lint:bytes"

      # A plan lane states a falsifiable premise about the code it intends to
      # change (docs/planning/, ```premise``` fences). A premise that stopped
      # holding means the gap was closed elsewhere and the lane must not be
      # dispatched; a premise that times out is inconclusive. Both fail the PR,
      # so a plan can never drift from the code un-noticed.
      - name: Verify plan premises (yarn plan:verify)
        run: "yarn plan:verify"

      # `arch validate` proves the layer rules; `sync --check` proves the tree
      # matches what the manifest emits; neither looks at the per-context
      # INVENTORIES (entities, value objects, use cases, ports, adapters)
      # listed in `.architecture/manifest.yaml`, and this closes that gap:
      # a declared entry with no module file, or a module file with no entry,
      # fails the PR. Sub-second, like the gates above.
      - name: Verify manifest inventories (yarn arch:inventory)
        run: "yarn arch:inventory"

      # ubuntu-latest ships no zsh at all. scripts/merge-prs.sh is zsh
      # (D184), and its own tests (tools/merge-prs/__tests__) run only
      # `describe.skipIf(!hasZsh())` — without this, the merge gate's only
      # wiring test silently skips everywhere it actually matters (S3, the
      # HX4 fix round). Every other suite in this repo is POSIX sh or
      # TypeScript and needs nothing here.
      #
      # It sits BEFORE the manifest step below, and not with the Test step it
      # used to sit above, because that step REPLAYS mutation manifests — and a
      # replay that cannot run its command is not a skipped test but a failed
      # claim. With zsh installed only later, tools/merge-prs registered no tests
      # at all here, every `-t` pattern in its manifest matched nothing, and
      # verify-manifests reported each one UNCHECKABLE COMMAND and failed the
      # build. A test that skips itself where its interpreter is missing is
      # right for a suite; for a manifest it is indistinguishable from a lie.
      - name: Install zsh (for D184's merge-prs.sh wiring tests)
        run: sudo apt-get update && sudo apt-get install -y zsh

      # A mutation manifest records the mutations a lane claims its tests catch.
      # Replaying it is what makes the claim evidence rather than a report: two
      # seats this week stated verdicts they had never observed, one quoting
      # failure messages from a suite whose own log showed it had not started.
      # Only manifests this change touches are REPLAYED — each mutation runs a
      # real test command, so replaying all of them every time would grow
      # without bound. A claim is checked when it is made.
      #
      # That scoping left a hole, and the same script now closes it: before any
      # replay it checks the ANCHORS of every manifest in the directory, touched
      # or not. A mutation's before-text must still appear exactly once in its
      # file, because `runMutation` refuses anything else (Rule 2) — so an
      # anchor broken by someone else's reformat makes that claim permanently
      # unrunnable, and being diff-scoped is exactly why nothing ever said so.
      # It is a string count over ~93 files: under a second, no build, no suite.
      - name: Check every anchor, replay changed mutation manifests
        env:
          # On a push, origin/main IS the pushed commit, so diffing against it
          # finds nothing and every manifest is skipped in silence. The pre-push
          # SHA is what "what this push changed" actually means.
          MANIFEST_DIFF_BASE: ${{ github.event.before }}
        run: "sh scripts/verify-manifests.sh"

      # Turbo caches task outputs keyed by input hash, so unchanged packages are
      # skipped on warm runs (cache_strategy = turbo-cache). Set TURBO_TOKEN
      # and TURBO_TEAM below for the cross-run remote cache.
      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # `check:env` is provided by the env-setup template. Resilient by design:
      # runs only if the script exists, so CI stays green whether or not
      # env-setup is installed (Item 3 will emit this step conditionally).
      - name: Validate env vars
        run: |
          if node -e "try { process.exit(require('./package.json').scripts?.['check:env'] ? 0 : 1) } catch { process.exit(1) }"; then
            yarn check:env
          else
            echo "no check:env script — skipping (env-setup not installed or package.json unreadable)"
          fi
        env:
          NODE_ENV: test

      - name: Build
        run: "yarn build"
        env:
          # TODO: add TURBO_TOKEN (secret) and TURBO_TEAM (variable) for the
          # remote Turbo cache. Safe to omit — the build just won't share cache.
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      - name: Typecheck
        run: "yarn typecheck"

      # X1: the formatter is a gate, not a suggestion. It runs BEFORE lint so a
      # formatting failure reads as "run yarn format", not as a lint error whose
      # message points somewhere else. The glob matches `yarn format`'s exactly —
      # the writer and the checker must not be able to disagree about scope, which
      # is why `.md` was dropped from both together rather than from one.
      - name: Format check (yarn format:check)
        run: "yarn format:check"

      - name: Lint
        run: "yarn lint"

      # An S3-compatible store for the ObjectStorePort conformance suite (PT-4a,
      # D201): SeaweedFS is the store staging runs (D201), and of the three
      # candidates in the 2026-10-02 spike it is the only one that honours
      # `If-None-Match: *` (412, original kept) — Garage silently overwrote, so a
      # conditional create tested against Garage would be testing nothing.
      #
      # `.github/seaweedfs/s3.json` holds CI-only literal identities: an admin key
      # this step uses to create the bucket, and an app key scoped to that one
      # bucket which the tests use. There is no anonymous identity, so a test that
      # forgets to sign is refused rather than served.
      #
      # It sits here, after the manifest replay and before the Test step, so the
      # replay keeps running without `TEST_S3_*` (every mutation must be caught
      # OFFLINE) and the store is up before the first step that needs it.
      # `-master.dir` is created first: `weed` does not.
      - name: SeaweedFS 4.48 (S3 conformance)
        run: |
          docker run -d --name seaweedfs -p 127.0.0.1:8333:8333 \
            -v "$PWD/.github/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            --entrypoint /bin/sh chrislusf/seaweedfs:4.48 -c \
            "mkdir -p /data/meta && exec /usr/bin/weed server -dir=/data -master.dir=/data/meta -volume.max=4 -master.volumeSizeLimitMB=256 -filer -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333 -ip=127.0.0.1 -ip.bind=0.0.0.0"
          healthy=
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8333/healthz >/dev/null; then healthy=1; break; fi
            sleep 1
          done
          if [ -z "$healthy" ]; then
            echo "::error::SeaweedFS never answered /healthz"
            docker logs seaweedfs
            exit 1
          fi
          bucketed=
          code=
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 aws:amz:us-east-1:s3 \
              --user ci-admin-key:ci-admin-secret -X PUT http://127.0.0.1:8333/campaign-foundry-test)
            if [ "$code" = 200 ]; then bucketed=1; break; fi
            sleep 1
          done
          if [ -z "$bucketed" ]; then
            echo "::error::SeaweedFS never accepted the bucket create (last status ${code:-none})"
            docker logs seaweedfs
            exit 1
          fi

      # run_tests = true; delete this step to skip tests in CI.
      # test:cov enforces the 100% coverage gate (vitest.config.ts thresholds).
      - name: Test
        run: "yarn test:cov"
        env:
          NODE_ENV: test
          # The PT-6a concurrency tests are skipped unless this is set. Nothing
          # else reads it: TEST_PG_URL is the harness's variable, and the step
          # below is the only one that sets it. This run is on PGlite.
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          # The ObjectStorePort conformance suite's real half. REQUIRED=1 turns a
          # missing or unreachable store into a FAILURE rather than a skip: this
          # step just started one, so a skip here would be a claim nothing checked.
          TEST_S3_ENDPOINT: http://127.0.0.1:8333
          TEST_S3_PUBLIC_ENDPOINT: http://127.0.0.1:8333
          TEST_S3_BUCKET: campaign-foundry-test
          TEST_S3_REGION: us-east-1
          TEST_S3_ACCESS_KEY_ID: ci-app-key
          TEST_S3_SECRET_ACCESS_KEY: ci-app-secret
          TEST_S3_REQUIRED: "1"

      # D186: the same API project, with TEST_PG_URL set, so every database test
      # runs against a real server instead of PGlite. PGlite is a real Postgres
      # compiled to WebAssembly, but it is one connection and 5.2-6.5s to start
      # on an older host, where 245 of 8,308 tests time out. The Test step above
      # stays the coverage gate, unchanged and on PGlite; this step is the
      # evidence that the server path works, and has no --coverage because the
      # 100% thresholds are the full run's.
      #
      # The TEST_S3_* block is repeated rather than hoisted into `env:` at job
      # level, because the manifest replay above must run WITHOUT it: every
      # mutation this change claims is caught by an offline test, and a replay
      # whose command needed a store would be unrunnable rather than unverified.
      - name: Test (real Postgres backend)
        run: "yarn vitest run --project api"
        env:
          NODE_ENV: test
          TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
          TEST_S3_ENDPOINT: http://127.0.0.1:8333
          TEST_S3_PUBLIC_ENDPOINT: http://127.0.0.1:8333
          TEST_S3_BUCKET: campaign-foundry-test
          TEST_S3_REGION: us-east-1
          TEST_S3_ACCESS_KEY_ID: ci-app-key
          TEST_S3_SECRET_ACCESS_KEY: ci-app-secret
          TEST_S3_REQUIRED: "1"

      # Tests live in __tests__/ next to their modules, but Nitro scans apps/api/server/
      # recursively. A *.test.ts file landing there gets registered as a route and crashes
      # `yarn dev` at boot — a runtime fault the build and coverage gate don't catch. Fail
      # the build if the Nitro route manifest ever references a test file.
      - name: Guard the API route scan against test files
        run: |
          MANIFEST="apps/api/.nitro/types/nitro-routes.d.ts"
          yarn workspace @campaignfoundry/api exec nitro prepare
          # Fail closed: a missing manifest means the guard can't validate anything.
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Nitro route manifest not found at $MANIFEST"
            exit 1
          fi
          # `\.test\b` is robust to Nitro's quoting/extension (matches .test', .test.ts, .test/, …).
          if grep -Eq '__tests__|\.test\b' "$MANIFEST"; then
            echo "::error::A test file was scanned as a Nitro route. Keep tests out of the server scan (see apps/api/nitro.config.ts \`ignore\`)."
            exit 1
          fi
          echo "Nitro route manifest is free of test files."

  # Dispatch entry for record-goldens.yml: GitHub 404s a workflow_dispatch
  # that is not on the default branch. This job is a no-op on push/PR.
  record-goldens:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.record_goldens == 'true' }}
    concurrency:
      group: record-goldens-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/record-goldens.yml
    with:
      suite: ${{ github.event.inputs.record_goldens_suite }}
    secrets: inherit
