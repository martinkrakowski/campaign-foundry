name: CI

# Generated by the hexagen ci-github-actions template. Commands target yarn
# (the package manager the generator and its templates use); npm/pnpm users
# should adjust the install/run commands (e.g. `npm ci`, `npm run <script>`).
# Choices recorded at install time:
#   triggers:        push-main-only,pull-request
#   run tests:       true
#   cache strategy:  turbo-cache
#   deploy target:   none
#   preview deploys: true
#   docker image:    false
#
# The `on:` block below pushes only on main and opens one run per PR commit
# (pull_request to main, on the merge ref), plus a workflow_dispatch entrypoint
# for golden recording; a branch push with no PR runs nothing.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      record_goldens:
        description: "Record compositor goldens (linux-x64 artifact). The CI job still runs."
        type: boolean
        default: false
      record_goldens_suite:
        description: "Which golden suite(s) record_goldens records. 'all' (default) re-records every family's fixture map for this platform key; 'audio' records ONLY compositor-goldens-mp4-audio.json and leaves every other fixture file untouched."
        type: choice
        options:
          - all
          - audio
        default: all

# Concurrency is one workflow-level group so the whole of a superseded run
# cancels together — a per-job group cannot do that without jobs of one run
# finishing each other's work. (1) A workflow_dispatch that records goldens
# used to share `ci-${{ github.ref }}` with the push Build, and the two
# cancelled each other (runs 34182560608 / 34182554160): `github.event_name`
# is in the group, so a dispatch and a push never share one. (2) On main every
# commit gets its own group (D182), so a push never cancels or replaces the run
# verifying the merge before it (98ac160d was cancelled by a docs push,
# 2026-09-29): the `-sha` suffix on `refs/heads/main` is byte-for-byte the old
# one; `cancel-in-progress: false` alone would not do — a group keeps one
# pending run and a third push replaces it — so other refs still cancel
# superseded runs. (3) The recorder must never be cancelled: a dispatch with
# `record_goldens == 'true'` gains a run-id suffix
# (`format('-record-{0}', github.run_id)`) so a second dispatch or any push
# cannot cancel the run that contains it; `record-goldens` keeps its own
# job-level group with `cancel-in-progress: false`.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}${{ github.event.inputs.record_goldens == 'true' && format('-record-{0}', github.run_id) || '' }}
  cancel-in-progress: true
# Eight parallel lanes plus one aggregate, each independent so a slow or red
# lane cannot block the others: `static` (arch, bytes, build, typecheck, lint,
# format), `test` (8 shards of the suite, coverage collected), `coverage`
# (merge the shards and re-apply the 100% thresholds), `mutations` (anchor +
# replay), `postgres` (real PG backend), `s3` (real SeaweedFS), and `ci` — the
# single job `scripts/merge-prs.sh` waits for (REQUIRED_CHECK='^Build'); it
# names every other job and fails closed if any did not succeed. `record-goldens`
# below is dispatch-only and excluded from the aggregate.
jobs:
  static:
    name: Static checks (arch, bytes, build, typecheck, lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The manifest-replay step below diffs against the base ref to find
          # which manifests this change touches; a depth-1 clone has no base.
          fetch-depth: 0

      # Corepack ships with the runner's pre-installed Node and must be enabled
      # BEFORE setup-node: the `cache: yarn` step below probes the cache folder
      # with whatever `yarn` is on PATH, and without Corepack that's Yarn Classic
      # – which reports the wrong folder and fails the cache step. Enabling here
      # installs the Yarn-4 shim (version read from package.json `packageManager`)
      # so the probe resolves Berry's cache folder. See SETUP.md.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          # yarn.lock is committed, so setup-node keys its cache on it. Corepack
          # (above) makes the probed folder Berry's global cache
          # (enableGlobalCache: true → ~/.yarn/berry/cache). A wrong/empty cache
          # only costs a re-download — `install --immutable` stays the source of
          # truth — so this can never turn a green build red.
          cache: "yarn"

      # Read the pinned version from package.json's `packageManager` at runtime
      # so CI can never drift from what the project declares (no baked version).
      # Runs under the Node setup-node just installed; the shim from Enable
      # Corepack stays on PATH (Node 22 ships no competing `yarn`).
      - name: Prepare package manager
        run: |
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate

      # yarn.lock is committed, so install is immutable: CI fails on a stale
      # lockfile instead of silently rewriting it. This also protects the
      # sync --check step below — its clean-tree preflight would otherwise
      # trip on an install-mutated lockfile and mask the real drift signal.
      - name: Install dependencies
        run: "yarn install --immutable"

      # Hexagen architecture gates (require >=0.7.0 — earlier CLIs exited 0 on
      # every failure mode, so gating was vacuous; see .agents/session-log.md,
      # 2026-06-09 entry). `sync --check` is read-only and exits 1 iff the
      # committed tree drifted from what .architecture/manifest.yaml generates;
      # `arch validate` enforces the layer/import rules. Both are sub-second,
      # hence ahead of the build for fail-fast.
      - name: Architecture drift gate (hexagen sync --check)
        run: "yarn sync:check"

      - name: Architecture lint (hexagen arch validate)
        run: "yarn lint:arch"

      # Nothing in the gate set looked at BYTES. A raw \x00 inside a string
      # literal in PlanCapacity.ts survived build, typecheck, lint, format:check
      # and all 6033 tests: TypeScript accepts a control byte in a literal,
      # ESLint parses it, Prettier reprints it unchanged, and every test that
      # read the string compared it against itself. It was caught only because a
      # mutation anchor stopped matching — by accident.
      #
      # This scans the tracked and untracked-but-not-ignored text files for C0
      # bytes other than tab and newline. Measured at 144ms over 919 files, so it
      # sits here with the other sub-second gates rather than behind the build: a
      # byte defect should be reported in a second, not after a suite.
      - name: Source byte hygiene (yarn lint:bytes)
        run: "yarn lint:bytes"

      # A plan lane states a falsifiable premise about the code it intends to
      # change (docs/planning/, ```premise``` fences). A premise that stopped
      # holding means the gap was closed elsewhere and the lane must not be
      # dispatched; a premise that times out is inconclusive. Both fail the PR,
      # so a plan can never drift from the code un-noticed.
      - name: Verify plan premises (yarn plan:verify)
        run: "yarn plan:verify"

      # `arch validate` proves the layer rules; `sync --check` proves the tree
      # matches what the manifest emits; neither looks at the per-context
      # INVENTORIES (entities, value objects, use cases, ports, adapters)
      # listed in `.architecture/manifest.yaml`, and this closes that gap:
      # a declared entry with no module file, or a module file with no entry,
      # fails the PR. Sub-second, like the gates above.
      - name: Verify manifest inventories (yarn arch:inventory)
        run: "yarn arch:inventory"

      # Turbo caches task outputs keyed by input hash, so unchanged packages are
      # skipped on warm runs (cache_strategy = turbo-cache). Set TURBO_TOKEN
      # and TURBO_TEAM below for the cross-run remote cache.
      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # `check:env` is provided by the env-setup template. Resilient by design:
      # runs only if the script exists, so CI stays green whether or not
      # env-setup is installed (Item 3 will emit this step conditionally).
      - name: Validate env vars
        run: |
          if node -e "try { process.exit(require('./package.json').scripts?.['check:env'] ? 0 : 1) } catch { process.exit(1) }"; then
            yarn check:env
          else
            echo "no check:env script — skipping (env-setup not installed or package.json unreadable)"
          fi
        env:
          NODE_ENV: test

      - name: Build
        run: "yarn build"
        env:
          # TODO: add TURBO_TOKEN (secret) and TURBO_TEAM (variable) for the
          # remote Turbo cache. Safe to omit — the build just won't share cache.
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      - name: Typecheck
        run: "yarn typecheck"

      # X1: the formatter is a gate, not a suggestion. It runs BEFORE lint so a
      # formatting failure reads as "run yarn format", not as a lint error whose
      # message points somewhere else. The glob matches `yarn format`'s exactly —
      # the writer and the checker must not be able to disagree about scope, which
      # is why `.md` was dropped from both together rather than from one.
      - name: Format check (yarn format:check)
        run: "yarn format:check"

      - name: Lint
        run: "yarn lint"

      # Tests live in __tests__/ next to their modules, but Nitro scans apps/api/server/
      # recursively. A *.test.ts file landing there gets registered as a route and crashes
      # `yarn dev` at boot — a runtime fault the build and coverage gate don't catch. Fail
      # the build if the Nitro route manifest ever references a test file.
      - name: Guard the API route scan against test files
        run: |
          MANIFEST="apps/api/.nitro/types/nitro-routes.d.ts"
          yarn workspace @campaignfoundry/api exec nitro prepare
          # Fail closed: a missing manifest means the guard can't validate anything.
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Nitro route manifest not found at $MANIFEST"
            exit 1
          fi
          # `\.test\b` is robust to Nitro's quoting/extension (matches .test', .test.ts, .test/, …).
          if grep -Eq '__tests__|\.test\b' "$MANIFEST"; then
            echo "::error::A test file was scanned as a Nitro route. Keep tests out of the server scan (see apps/api/nitro.config.ts `ignore`)."
            exit 1
          fi
          echo "Nitro route manifest is free of test files."
  test:
    name: Test shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # SETUP (steps 1-5), then:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Same setup as static; see the comments there.
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "yarn"
      - name: Prepare package manager
        run: |
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
      - name: Install dependencies
        run: "yarn install --immutable"

      # ubuntu-latest ships no zsh at all. scripts/merge-prs.sh is zsh
      # (D184), and its own tests (tools/merge-prs/__tests__) run only
      # `describe.skipIf(!hasZsh())` — without this, the merge gate's only
      # wiring test silently skips everywhere it actually matters (S3, the
      # HX4 fix round). Every other suite in this repo is POSIX sh or
      # TypeScript and needs nothing here.
      #
      # It sits BEFORE the manifest step below, and not with the Test step it
      # used to sit above, because that step REPLAYS mutation manifests — and a
      # replay that cannot run its command is not a skipped test but a failed
      # claim. With zsh installed only later, tools/merge-prs registered no tests
      # at all here, every `-t` pattern in its manifest matched nothing, and
      # verify-manifests reported each one UNCHECKABLE COMMAND and failed the
      # build. A test that skips itself where its interpreter is missing is
      # right for a suite; for a manifest it is indistinguishable from a lie.
      - name: Install zsh (for D184's merge-prs.sh wiring tests)
        run: sudo apt-get update && sudo apt-get install -y zsh

      # `test` is the only Test in CI, sharded so each runner pays a sixth of
      # the suite's wall time. yarn test:cov is `vitest run --coverage`, the
      # single definition — `yarn test:cov <args>` appends args (Yarn Berry).
      #
      # The thresholds are applied by the `coverage` job on the MERGED map, so a
      # shard only needs to stop itself from failing on its own slice — the four
      # zero-threshold flags do that (the config stays at 100/100/100/100 and
      # is unchanged). `--reporter=default` is kept so a failing test prints in
      # this log; `github-actions` is listed because naming any reporter
      # removes Vitest's implicit one, and today's run annotates failing tests
      # on the PR.
      - name: Test (shard ${{ matrix.shard }}/${{ strategy.job-total }}, coverage collected)
        run: >-
          yarn test:cov
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=default
          --reporter=blob
          --reporter=github-actions
          --coverage.reporter=text-summary
          --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0
          --coverage.thresholds.statements=0
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      # Measures R1 (blob size); a missing file here means the blob reporter
      # did not write, which fails the shard loudly so the merge job does not hang.
      - name: Size of this shard's report
        run: ls -la .vitest-reports

      # `.vitest-reports` starts with a dot: upload-artifact v4.4+ skips any path
      # that has a dot-segment unless this flag is set.
      - name: Upload this shard's report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/blob-${{ matrix.shard }}-${{ strategy.job-total }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage (merge the shards, 100% thresholds)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SETUP (steps 1-5), then:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Same setup as static; see the comments there.
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "yarn"
      - name: Prepare package manager
        run: |
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
      - name: Install dependencies
        run: "yarn install --immutable"

      - name: Download every shard's report
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: .vitest-reports

      - name: Every shard's report arrived
        run: |
          set -eu
          ls -la .vitest-reports
          total=$(ls .vitest-reports/blob-*-*.json | head -n 1 | sed -E 's/.*blob-[0-9]+-([0-9]+)\.json/\1/')
          for i in $(seq 1 "$total"); do
            test -f ".vitest-reports/blob-$i-$total.json" || { echo "::error::missing shard report $i/$total"; exit 1; }
          done
          [ "$(ls .vitest-reports | wc -l)" -eq "$total" ] || { echo "::error::.vitest-reports holds files that are not the $total shard reports"; exit 1; }

      # run_tests = true; delete this step to skip tests in CI.
      # test:cov enforces the 100% coverage gate (vitest.config.ts thresholds);
      # here it is run on the MERGED shard reports, so the thresholds are applied
      # to the union of the shards over the config's include set.
      - name: Merge the shard reports and apply the 100% thresholds
        run: "yarn vitest run --merge-reports --coverage"
        env:
          NODE_ENV: test

  # The mutation phase: plan which manifests changed, check every anchor in
  # parallel with the replay legs, then replay each group on its own runner.
  # One checkout per leg, one leg per changed manifest, grouped above 6 (see
  # the mutation fan-out decision in .agents/briefs/CI2-mutation-fanout.md).
  mutations-plan:
    name: Mutations plan (which manifests changed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The base logic (pull_request base, push `before`, force-push fallback) lives in
      # scripts/verify-manifests.sh and nowhere else; --list prints the changed manifests.
      - name: List the changed manifests and group them into legs
        id: plan
        env:
          # On a push, origin/main IS the pushed commit; the pre-push SHA is what the
          # push changed (same variable, same reason, as the old replay step).
          MANIFEST_DIFF_BASE: ${{ github.event.before }}
          MAX_LEGS: "6"
        # bash named explicitly, for pipefail: a failed command inside a pipeline must fail this
        # step, never shorten the list that the replay legs are built from.
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/verify-manifests.sh --list > "$RUNNER_TEMP/changed.txt"
          count=$(wc -l < "$RUNNER_TEMP/changed.txt" | tr -d ' ')
          matrix=$(sh scripts/mutation-matrix.sh < "$RUNNER_TEMP/changed.txt")
          echo "changed manifests: $count"
          cat "$RUNNER_TEMP/changed.txt"
          printf '%s\n' "$matrix" | jq -r '.include[].manifests | select(. != "")' | LC_ALL=C sort > "$RUNNER_TEMP/planned.txt"
          LC_ALL=C sort "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/listed.txt"
          if ! cmp -s "$RUNNER_TEMP/listed.txt" "$RUNNER_TEMP/planned.txt"; then
            echo "::error::the matrix does not cover the changed manifests exactly"
            diff "$RUNNER_TEMP/listed.txt" "$RUNNER_TEMP/planned.txt" || true
            exit 1
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'count=%s\n' "$count" >> "$GITHUB_OUTPUT"
      # set -eu without pipefail is fine: no pipe whose left side may fail silently;
      # a failing --list (exit 2) fails the step and the job.

  mutations-anchors:
    name: Mutation anchors (every manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SETUP (steps 1-5), then:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Same setup as static; see the comments there.
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "yarn"
      - name: Prepare package manager
        run: |
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
      - name: Install dependencies
        run: "yarn install --immutable"

      # ubuntu-latest ships no zsh at all. scripts/merge-prs.sh is zsh
      # (D184), and its own tests (tools/merge-prs/__tests__) run only
      # `describe.skipIf(!hasZsh())` — without this, the merge gate's only
      # wiring test silently skips everywhere it actually matters (S3, the
      # HX4 fix round). Every other suite in this repo is POSIX sh or
      # TypeScript and needs nothing here.
      #
      # It sits BEFORE the manifest step below, and not with the Test step it
      # used to sit above, because that step REPLAYS mutation manifests — and a
      # replay that cannot run its command is not a skipped test but a failed
      # claim. With zsh installed only later, tools/merge-prs registered no tests
      # at all here, every `-t` pattern in its manifest matched nothing, and
      # verify-manifests reported each one UNCHECKABLE COMMAND and failed the
      # build. A test that skips itself where its interpreter is missing is
      # right for a suite; for a manifest it is indistinguishable from a lie.
      - name: Install zsh (for D184's merge-prs.sh wiring tests)
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Check every anchor in every manifest
        run: "sh scripts/verify-manifests.sh --anchors"

  mutations:
    name: Mutations replay (${{ matrix.name }})
    needs: mutations-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutations-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ matrix.manifests != '' }}
        with:
          fetch-depth: 0
      # Corepack, setup-node, Prepare package manager, Install dependencies, Install zsh:
      # the same five steps as mutations-anchors, each with if: ${{ matrix.manifests != '' }}
      - name: Enable Corepack
        if: ${{ matrix.manifests != '' }}
        run: corepack enable
      - uses: actions/setup-node@v5
        if: ${{ matrix.manifests != '' }}
        with:
          node-version: "22"
          cache: "yarn"
      - name: Prepare package manager
        if: ${{ matrix.manifests != '' }}
        run: |
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
      - name: Install dependencies
        if: ${{ matrix.manifests != '' }}
        run: "yarn install --immutable"
      - name: Install zsh (for D184's merge-prs.sh wiring tests)
        if: ${{ matrix.manifests != '' }}
        run: sudo apt-get update && sudo apt-get install -y zsh
      # A mutation manifest records the mutations a lane claims its tests catch.
      # Replaying it is what makes the claim evidence rather than a report: two
      # seats this week stated verdicts they had never observed, one quoting
      # failure messages from a suite whose own log showed it had not started.
      # Only manifests this change touches are REPLAYED — each mutation runs a
      # real test command, so replaying all of them every time would grow
      # without bound. A claim is checked when it is made.
      - name: Replay this leg's manifests
        if: ${{ matrix.manifests != '' }}
        env:
          MANIFESTS: ${{ matrix.manifests }}
        run: printf '%s\n' "$MANIFESTS" | sh scripts/verify-manifests.sh --replay
      - name: Nothing to replay (no manifest changed)
        if: ${{ matrix.manifests == '' }}
        env:
          PLAN_COUNT: ${{ needs.mutations-plan.outputs.count }}
        run: |
          if [ "$PLAN_COUNT" != "0" ]; then
            echo "::error::this leg has no manifest but the plan listed '$PLAN_COUNT'"
            exit 1
          fi
          echo "no manifest changed against the base; the plan job reported 0"

  postgres:
    name: Postgres backend (api project against a real server)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # SETUP (steps 1-5), then:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Same setup as static; see the comments there.
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "yarn"
      - name: Prepare package manager
        run: |
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
      - name: Install dependencies
        run: "yarn install --immutable"

      # D186: the same API project, with TEST_PG_URL set, so every database test
      # runs against a real server instead of PGlite. PGlite is a real Postgres
      # compiled to WebAssembly, but it is one connection and 5.2-6.5s to start
      # on an older host, where 245 of 8,308 tests time out. The `test` shards
      # stay the coverage gate, on PGlite; this job is the
      # evidence that the server path works, and has no --coverage because the
      # 100% thresholds are the full run's.
      - name: Test (real Postgres backend)
        run: "yarn vitest run --project api"
        env:
          NODE_ENV: test
          TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres

  s3:
    name: S3 conformance (real SeaweedFS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SETUP (steps 1-5), then:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Same setup as static; see the comments there.
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "yarn"
      - name: Prepare package manager
        run: |
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
      - name: Install dependencies
        run: "yarn install --immutable"

      # An S3-compatible store for the ObjectStorePort conformance suite (PT-4a,
      # D201): SeaweedFS is the store staging runs (D201), and of the three
      # candidates in the 2026-10-02 spike it is the only one that honours
      # `If-None-Match: *` (412, original kept) — Garage silently overwrote, so a
      # conditional create tested against Garage would be testing nothing.
      #
      # `.github/seaweedfs/s3.json` holds CI-only literal identities: an admin key
      # this step uses to create the bucket, and an app key scoped to that one
      # bucket which the tests use. There is no anonymous identity, so a test that
      # forgets to sign is refused rather than served.
      #
      # It is its own job, so the manifest replay (the `mutations` job) and the
      # coverage shards run without `TEST_S3_*` (every mutation must be caught
      # OFFLINE) and the store is up before the first step that needs it.
      # `-master.dir` is created first: `weed` does not.
      - name: SeaweedFS 4.48 (S3 conformance)
        run: |
          docker run -d --name seaweedfs -p 127.0.0.1:8333:8333 \
            -v "$PWD/.github/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            --entrypoint /bin/sh chrislusf/seaweedfs:4.48 -c \
            "mkdir -p /data/meta && exec /usr/bin/weed server -dir=/data -master.dir=/data/meta -volume.max=4 -master.volumeSizeLimitMB=256 -filer -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333 -ip=127.0.0.1 -ip.bind=0.0.0.0"
          healthy=
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8333/healthz >/dev/null; then healthy=1; break; fi
            sleep 1
          done
          if [ -z "$healthy" ]; then
            echo "::error::SeaweedFS never answered /healthz"
            docker logs seaweedfs
            exit 1
          fi
          bucketed=
          code=
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 aws:amz:us-east-1:s3 \
              --user ci-admin-key:ci-admin-secret -X PUT http://127.0.0.1:8333/campaign-foundry-test)
            if [ "$code" = 200 ]; then bucketed=1; break; fi
            sleep 1
          done
          if [ -z "$bucketed" ]; then
            echo "::error::SeaweedFS never accepted the bucket create (last status ${code:-none})"
            docker logs seaweedfs
            exit 1
          fi

      # The ObjectStorePort conformance suite's real half, alone, right after the
      # store starts. It runs in its own step rather than inside `Test` because a
      # 4-core runner saturated by the full suite starves SeaweedFS's internal
      # heartbeats, and its master then answers every PUT with 500 InternalError
      # (#656's first CI run). REQUIRED=1 turns a missing or unreachable store into
      # a FAILURE rather than a skip. The steps below carry no TEST_S3_*, so their
      # real half skips; coverage never depended on it (offline tests reach 100%).
      - name: S3 conformance (real SeaweedFS)
        run: "yarn vitest run --project api apps/api/server/lib/object-store"
        env:
          NODE_ENV: test
          TEST_S3_ENDPOINT: http://127.0.0.1:8333
          TEST_S3_PUBLIC_ENDPOINT: http://127.0.0.1:8333
          TEST_S3_BUCKET: campaign-foundry-test
          TEST_S3_REGION: us-east-1
          TEST_S3_ACCESS_KEY_ID: ci-app-key
          TEST_S3_SECRET_ACCESS_KEY: ci-app-secret
          TEST_S3_REQUIRED: "1"

      - name: SeaweedFS logs (on failure)
        if: failure()
        run: docker logs --tail 300 seaweedfs || true

      - name: Stop SeaweedFS
        if: always()
        run: docker rm -f seaweedfs || true

  # `ci` is the one name `scripts/merge-prs.sh` waits for (REQUIRED_CHECK='^Build',
  # pinned to this key and name by tools/gate/__tests__/required-check.test.ts)
  # and, since the single job was split, the only place that notices a job that
  # did not succeed. required-check.test.ts walks from `  ci:` forward and breaks
  # on the first two-space comment after it, so this comment sits ABOVE the key
  # (with the other job separators) and `name:` must be the line directly after
  # `  ci:` — no two-space comment in between.
  ci:
    name: Build, Typecheck, Lint & Test
    if: ${{ !cancelled() }}
    needs: [static, test, coverage, mutations-plan, mutations-anchors, mutations, postgres, s3]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          count=$(echo "$NEEDS" | jq 'length')
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(",")')
          if [ "$count" -ne 8 ]; then
            echo "::error::expected 8 needed jobs, the needs context holds $count"
            exit 1
          fi
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad"
            exit 1
          fi

  # Dispatch entry for record-goldens.yml: GitHub 404s a workflow_dispatch
  # that is not on the default branch. This job is a no-op on push/PR.
  record-goldens:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.record_goldens == 'true' }}
    concurrency:
      group: record-goldens-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/record-goldens.yml
    with:
      suite: ${{ github.event.inputs.record_goldens_suite }}
    secrets: inherit
